name: testing

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # govulncheck_job:
  #  runs-on: ubuntu-latest
  #  name: Run govulncheck
  #  steps:
  #    - id: govulncheck
  #      uses: golang/govulncheck-action@v1
  #      with:
  #        work-dir: .
  #        go-version-file: 'go.mod'
  testing-main-nightly:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GITEA_SDK_TEST_URL: "http://127.0.0.1:3300"
      GITEA_SDK_TEST_USERNAME: "test01"
      GITEA_SDK_TEST_PASSWORD: "test01"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - run: make clean
      - run: make vet
      - run: make lint
      - run: make build
      - run: make test-unit
      - run: |
          mkdir -p test-main-nightly/conf test-main-nightly/data
          wget https://dl.gitea.com/gitea/main-nightly/gitea-main-nightly-linux-amd64 -O test-main-nightly/gitea-main-nightly
          chmod +x test-main-nightly/gitea-main-nightly
          cat > test-main-nightly/conf/app.ini <<EOF
          I_AM_BEING_UNSAFE_RUNNING_AS_ROOT = true
          [security]
          INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE1NTg4MzY4ODB9.LoKQyK5TN_0kMJFVHWUW0uDAyoGjDP6Mkup4ps2VJN4
          INSTALL_LOCK   = true
          SECRET_KEY     = 2crAW4UANgvLipDS6U5obRcFosjSJHQANll6MNfX7P0G3se3fKcCwwK3szPyGcbo
          PASSWORD_COMPLEXITY = off
          [database]
          DB_TYPE = sqlite3
          [repository]
          ROOT = ${GITHUB_WORKSPACE}/test-main-nightly/data/
          [server]
          HTTP_PORT = 3300
          ROOT_URL = http://127.0.0.1:3300
          EOF
          test-main-nightly/gitea-main-nightly migrate -c test-main-nightly/conf/app.ini
          test-main-nightly/gitea-main-nightly admin user create --username=test01 --password=test01 --email=test01@gitea.io --admin=true --must-change-password=false --access-token -c test-main-nightly/conf/app.ini
          nohup test-main-nightly/gitea-main-nightly web -c test-main-nightly/conf/app.ini > test-main-nightly/gitea.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --noproxy "*" --fail --silent http://127.0.0.1:3300/api/v1/version > /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
      - run: make test-integration-main-nightly
  testing-stable:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GITEA_SDK_TEST_URL: "http://127.0.0.1:3000"
      GITEA_SDK_TEST_USERNAME: "test01"
      GITEA_SDK_TEST_PASSWORD: "test01"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - run: make clean
      - run: |
          mkdir -p test-stable/conf test-stable/data
          wget https://dl.gitea.com/gitea/1.26.1/gitea-1.26.1-linux-amd64 -O test-stable/gitea-stable
          chmod +x test-stable/gitea-stable
          cat > test-stable/conf/app.ini <<EOF
          I_AM_BEING_UNSAFE_RUNNING_AS_ROOT = true
          [security]
          INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE1NTg4MzY4ODB9.LoKQyK5TN_0kMJFVHWUW0uDAyoGjDP6Mkup4ps2VJN4
          INSTALL_LOCK   = true
          SECRET_KEY     = 2crAW4UANgvLipDS6U5obRcFosjSJHQANll6MNfX7P0G3se3fKcCwwK3szPyGcbo
          PASSWORD_COMPLEXITY = off
          [database]
          DB_TYPE = sqlite3
          [repository]
          ROOT = ${GITHUB_WORKSPACE}/test-stable/data/
          [server]
          HTTP_PORT = 3000
          ROOT_URL = http://127.0.0.1:3000
          EOF
          test-stable/gitea-stable migrate -c test-stable/conf/app.ini
          test-stable/gitea-stable admin user create --username=test01 --password=test01 --email=test01@gitea.io --admin=true --must-change-password=false --access-token -c test-stable/conf/app.ini
          nohup test-stable/gitea-stable web -c test-stable/conf/app.ini > test-stable/gitea.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            if curl --noproxy "*" --fail --silent http://127.0.0.1:3000/api/v1/version > /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
      - run: make test-integration-stable
