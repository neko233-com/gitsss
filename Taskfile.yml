version: '3'

vars:
  BUILD_IMAGE: '{{default "gitsss/gitsss:latest" .BUILD_IMAGE}}'
  DOCKER_IMAGE: '{{default "gitsss/gitsss" .DOCKER_IMAGE}}'
  DOCKER_TAG: '{{default "latest" .DOCKER_TAG}}'

tasks:
  verify:native:
    desc: Rehearse a native SQLite takeover using an independent private snapshot
    cmds:
      - '{{.PYTHON}} tools/rehearse-native.py {{.CLI_ARGS}}'
    vars:
      PYTHON: '{{.PYTHON | default "python3"}}'

  verify:git:
    desc: Exercise GitSSS Git HTTP, LFS, permissions and optional SSH from this machine
    cmds:
      - '{{.PYTHON}} tools/verify-git.py {{.CLI_ARGS}}'
    vars:
      PYTHON: '{{.PYTHON | default "python3"}}'

  agent:ops:
    desc: Read GitSSS health/Actions status or explicitly dispatch/rerun work
    cmds:
      - '{{.PYTHON}} tools/agent-ops.py {{.CLI_ARGS}}'
    vars:
      PYTHON: '{{.PYTHON | default "python3"}}'

  default:
    desc: List available tasks
    cmds:
      - task: help

  help:
    desc: List Taskfile commands
    cmds:
      - task --list --sort none

  fmt:
    desc: Format Go and template files
    cmds:
      - task: make
        vars: {TARGET: fmt}

  fmt:check:
    desc: Verify Go and template formatting
    cmds:
      - task: make
        vars: {TARGET: fmt-check}

  lint:
    desc: Run all linters
    cmds:
      - task: make
        vars: {TARGET: lint}

  lint:go:
    desc: Lint Go files
    cmds:
      - task: make
        vars: {TARGET: lint-go}

  lint:js:
    desc: Lint TypeScript and Vue files
    cmds:
      - task: make
        vars: {TARGET: lint-js}

  lint:css:
    desc: Lint CSS and Vue styles
    cmds:
      - task: make
        vars: {TARGET: lint-css}

  lint:md:
    desc: Lint Markdown files
    cmds:
      - task: make
        vars: {TARGET: lint-md}

  tidy:
    desc: Tidy Go modules and regenerate license metadata
    cmds:
      - task: make
        vars: {TARGET: tidy}

  build:
    desc: Build frontend and backend
    cmds:
      - task: make
        vars: {TARGET: build}

  build:host:
    desc: Build frontend and backend on the host, without Docker
    cmds:
      - make build

  backend:host:
    desc: Build only the backend binary on the host
    cmds:
      - make backend-quick

  release:native:
    desc: Cross-compile release binaries on the host without xgo
    cmds:
      - make release-native VERSION="{{.VERSION}}" RELEASE_JOBS="{{.RELEASE_JOBS}}" XZ_LEVEL="{{.XZ_LEVEL}}" RELEASE_GOGIT="{{.RELEASE_GOGIT}}"
    vars:
      VERSION: '{{.VERSION | default ""}}'
      RELEASE_JOBS: '{{.RELEASE_JOBS | default "2"}}'
      XZ_LEVEL: '{{.XZ_LEVEL | default "6"}}'
      RELEASE_GOGIT: '{{.RELEASE_GOGIT | default ""}}'

  test:
    desc: Run frontend and backend tests
    cmds:
      - task: test:js
      - task: test:go

  test:go:
    desc: Run backend tests
    cmds:
      - task: make:unprivileged
        vars: {TARGET: test-backend}

  test:js:
    desc: Run frontend tests
    cmds:
      - task: make
        vars: {TARGET: test-frontend}

  test:e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - task: make
        vars: {TARGET: test-e2e}

  check:
    desc: Run consistency checks
    cmds:
      - task: make
        vars: {TARGET: checks}

  docker:
    desc: Build the local Docker image
    cmds:
      - docker build -t "{{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}" .

  vbox:check:
    desc: Check the local GitHub neko233-com/vbox provider
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action check

  vbox:pull:
    desc: Pull the GitSSS image with GitHub neko233-com/vbox
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action pull

  vbox:load:
    desc: Load a Docker save archive into GitHub neko233-com/vbox
    requires:
      vars: [IMAGE_ARCHIVE]
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action load -ImageArchive "{{.IMAGE_ARCHIVE}}"

  vbox:install:
    desc: Run GitSSS locally with GitHub neko233-com/vbox
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action install

  vbox:verify:
    desc: Verify GitSSS HTTP health with GitHub neko233-com/vbox instead of Docker
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action verify

  vbox:logs:
    desc: Show GitSSS logs from GitHub neko233-com/vbox
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action logs

  vbox:stop:
    desc: Stop the local GitSSS vbox container
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action stop

  vbox:remove:
    desc: Remove the local GitSSS vbox container and keep its data directory
    cmds:
      - powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/vbox/gitsss.ps1 -Action remove

  release:
    desc: Cross-compile release binaries on the host without xgo
    cmds:
      - task: release:native

  release:check:
    desc: Generate release checksums
    cmds:
      - task: make
        vars: {TARGET: release-check}

  release:sources:
    desc: Build the versioned source archive
    cmds:
      - task: make
        vars: {TARGET: release-sources}

  make:
    internal: true
    requires:
      vars: [TARGET]
    cmds:
      - sh build/task-make.sh {{.TARGET}}

  make:unprivileged:
    internal: true
    requires:
      vars: [TARGET]
    cmds:
      - sh build/task-make.sh {{.TARGET}} unprivileged
