name: gitsss release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build web client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  packages:
    name: ${{ matrix.goos }}-${{ matrix.goarch }} package
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Build and package
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          PACKAGE_ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="dev-${GITHUB_SHA::7}"
          fi
          name="gitsss-${version}-${GOOS}-${GOARCH}"
          suffix=""
          if [[ "${GOOS}" == "windows" ]]; then
            suffix=".exe"
          fi
          mkdir -p "stage/${name}/web" release
          CGO_ENABLED=0 go -C server build -trimpath -ldflags="-s -w" -o "../stage/${name}/gitsss${suffix}" ./cmd/gitsss
          CGO_ENABLED=0 go -C server build -trimpath -ldflags="-s -w" -o "../stage/${name}/gitsss-agent${suffix}" ./cmd/gitsss-agent
          cp -R web-dist/. "stage/${name}/web/"
          cp server/README.md "stage/${name}/README.md"
          if [[ "${PACKAGE_ARCHIVE}" == "zip" ]]; then
            (cd stage && zip -q -r "../release/${name}.zip" "${name}")
          else
            tar -C stage -czf "release/${name}.tar.gz" "${name}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Publish signed manifest and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum ./* > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
