services:
  gitsss:
    image: ${GITSSS_IMAGE:-gitsss/gitsss:latest}
    container_name: gitsss
    restart: unless-stopped
    environment:
      USER_UID: ${GITSSS_UID:-1000}
      USER_GID: ${GITSSS_GID:-1000}
      GITSSS__server__ROOT_URL: ${GITSSS_ROOT_URL:-http://localhost:3000/}
      GITSSS__server__HTTP_PORT: 3000
      GITSSS__server__LFS_START_SERVER: "true"
      GITSSS__server__SSH_PORT: ${GITSSS_SSH_PORT:-2222}
      GITSSS__server__SSH_LISTEN_PORT: 22
      GITSSS__repository__ALLOW_FORK_INTO_SAME_OWNER: ${GITSSS_ALLOW_FORK_INTO_SAME_OWNER:-true}
      GITSSS__security__INSTALL_LOCK: "true"
      GITSSS__security__MIN_PASSWORD_LENGTH: ${GITSSS_MIN_PASSWORD_LENGTH:-4}
      GITSSS__cron.update_checker__ENABLED: "false"
      GITSSS_CREATE_DEFAULT_ADMIN: ${GITSSS_CREATE_DEFAULT_ADMIN:-true}
      GITSSS_INITIAL_ADMIN_USER: ${GITSSS_INITIAL_ADMIN_USER:-root}
      GITSSS_INITIAL_ADMIN_PASSWORD: ${GITSSS_INITIAL_ADMIN_PASSWORD:-root}
      GITSSS_INITIAL_ADMIN_EMAIL: ${GITSSS_INITIAL_ADMIN_EMAIL:-root@localhost.invalid}
      GITSSS_INITIAL_ADMIN_MUST_CHANGE_PASSWORD: ${GITSSS_INITIAL_ADMIN_MUST_CHANGE_PASSWORD:-true}
      GITSSS_ACTIONS_JOB_IMAGE: ${GITSSS_ACTIONS_JOB_IMAGE:-gitsss/gitsss:latest}
      GITSSS_ACTIONS_JOB_INSTANCE_URL: ${GITSSS_ACTIONS_JOB_INSTANCE_URL:-http://host.docker.internal:3000}
      GITSSS_ACTIONS_CONTAINER_OPTIONS: ${GITSSS_ACTIONS_CONTAINER_OPTIONS:---cpus=4 --memory=8g --pids-limit=2048}
    ports:
      - "${GITSSS_HTTP_BIND:-0.0.0.0}:${GITSSS_HTTP_PORT:-3000}:3000"
      - "${GITSSS_SSH_BIND:-0.0.0.0}:${GITSSS_SSH_PORT:-2222}:22"
      - "127.0.0.1:8088:8088"
    volumes:
      - gitsss-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true

volumes:
  gitsss-data:
    name: ${GITSSS_DATA_VOLUME:-gitsss-data}
